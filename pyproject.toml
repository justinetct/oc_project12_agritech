[project]
name = "agritech-answers"
version = "1.0.0"
description = "Crop yield prediction and crop recommendation from field conditions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "scikit-learn (>=1.5,<2.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "requests (>=2.32,<3.0)",
]

[tool.poetry]
packages = [{ include = "agritech", from = "src" }]

[tool.poetry.group.api.dependencies]
fastapi = ">=0.141.1,<0.142.0"
uvicorn = { version = ">=0.54.0,<0.55.0", extras = ["standard"] }
pydantic = ">=2.13.5,<3.0.0"
sqlalchemy = ">=2,<3"
logfire = ">=5,<6"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.notebook.dependencies]
matplotlib = ">=3.9,<4.0"
seaborn = ">=0.13.2,<0.14.0"
ipykernel = ">=6.29,<7.0"
ipywidgets = ">=8.1.9,<9.0.0"
fg-data-profiling = ">=4.19.1,<5.0.0"
mlflow-skinny = ">=2.20.3,<2.21"
xgboost = ">=3.4.1,<4.0.0"
lightgbm = ">=4.7.0,<5.0.0"
catboost = ">=1.2.10,<2.0.0"
shap = ">=0.52.0,<0.53.0"
setuptools = "<82"

# Groupes des interfaces : chacun déclare aussi les paquets importés par son code
# (`agritech.ui`), car son image Docker n'installe pas les dépendances de l'API.
[tool.poetry.group.streamlit.dependencies]
streamlit = ">=1.40,<2.0"
requests = ">=2.32,<3.0"
pydantic = ">=2.13.5,<3.0.0"

[tool.poetry.group.gradio.dependencies]
gradio = ">=6.29.1,<7.0"
altair = ">=5.5,<6"
requests = ">=2.32,<3.0"
pydantic = ">=2.13.5,<3.0.0"
python-dotenv = ">=1.0,<2.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "markdown (>=3.6)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agritech.api --cov=agritech.serving --cov=agritech.monitoring --cov=agritech.observability --cov=agritech.ui --cov-report=term-missing"

[tool.coverage.run]
source = ["agritech.api", "agritech.serving", "agritech.monitoring", "agritech.observability", "agritech.ui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" role="img" aria-label="Les deux pipelines du projet : Agriculture CropYield alimente /predict, le dataset historique consolidé alimente /recommend, sans fusion ligne à ligne.">
  <title>Deux jeux de données, deux services</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa47c"/>
    </marker>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .hd  { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .hs  { font-size: 12px; fill: #b7e0c8; }
      .bt  { font-size: 13.5px; font-weight: 700; fill: #14452f; }
      .bl  { font-size: 12px; fill: #63706a; }
      .num { font-size: 12px; font-weight: 700; fill: #2c7a53; }
      .eyebrow { font-size: 10.5px; font-weight: 700; fill: #8a5a00; letter-spacing: 1.4px; }
      .foot { font-size: 13px; fill: #1e2a24; }
      .footb { font-size: 13px; font-weight: 700; fill: #14452f; }
    </style>
  </defs>

  <rect width="900" height="552" fill="#ffffff"/>

  <!-- ─────────── colonne /predict ─────────── -->
  <rect x="24" y="20" width="400" height="44" rx="10" fill="#14452f"/>
  <text class="t hd" x="44" y="42">/predict</text>
  <text class="t hs" x="44" y="57">estimer le rendement d’une parcelle</text>

  <rect x="24" y="86" width="400" height="74" rx="10" fill="#ffffff" stroke="#dde8e2"/>
  <text class="t eyebrow" x="44" y="108">SOURCE</text>
  <text class="t bt" x="44" y="128">Agriculture CropYield</text>
  <text class="t bl" x="44" y="146">1 000 000 lignes · 1 parcelle sur 1 saison</text>

  <line x1="224" y1="160" x2="224" y2="180" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="24" y="186" width="400" height="92" rx="10" fill="#f6faf8" stroke="#dde8e2"/>
  <text class="t eyebrow" x="44" y="208">JEU D’ENTRAÎNEMENT</text>
  <text class="t num" x="44" y="228">999 769 lignes · 6 variables</text>
  <text class="t bl" x="44" y="246">Crop · Soil_Type · Rainfall_mm · Temperature_Celsius</text>
  <text class="t bl" x="44" y="263">Fertilizer_Used · Irrigation_Used</text>

  <line x1="224" y1="278" x2="224" y2="298" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="24" y="304" width="400" height="58" rx="10" fill="#ffffff" stroke="#dde8e2"/>
  <text class="t bt" x="44" y="329">Régression à l’échelle de la parcelle</text>
  <text class="t bl" x="44" y="348">cible : Yield_tons_per_hectare</text>

  <line x1="224" y1="362" x2="224" y2="382" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="24" y="388" width="400" height="72" rx="10" fill="#e9f3ed" stroke="#5aa47c"/>
  <text class="t eyebrow" x="44" y="410">RÉPONSE</text>
  <text class="t bt" x="44" y="430">Un rendement estimé, en t/ha</text>
  <text class="t bl" x="44" y="448">pour la culture et les conditions saisies</text>

  <!-- ─────────── colonne /recommend ─────────── -->
  <rect x="476" y="20" width="400" height="44" rx="10" fill="#2c7a53"/>
  <text class="t hd" x="496" y="42">/recommend</text>
  <text class="t hs" x="496" y="57">classer les cultures d’un pays</text>

  <rect x="476" y="86" width="400" height="74" rx="10" fill="#ffffff" stroke="#dde8e2"/>
  <text class="t eyebrow" x="496" y="108">SOURCE</text>
  <text class="t bt" x="496" y="128">Historique consolidé (4 fichiers FAO / climat)</text>
  <text class="t bl" x="496" y="146">22 679 lignes · pays × année × culture · 1990-2013</text>

  <line x1="676" y1="160" x2="676" y2="180" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="476" y="186" width="400" height="92" rx="10" fill="#f6faf8" stroke="#dde8e2"/>
  <text class="t eyebrow" x="496" y="208">JEU D’ENTRAÎNEMENT</text>
  <text class="t num" x="496" y="228">15 664 lignes · 4 variables · 117 pays</text>
  <text class="t bl" x="496" y="246">crop · temp_hist · rain_mm · log_pest_hist</text>
  <text class="t bl" x="496" y="263">contexte hors modèle : iso3 · area · year</text>

  <line x1="676" y1="278" x2="676" y2="298" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="476" y="304" width="400" height="58" rx="10" fill="#ffffff" stroke="#dde8e2"/>
  <text class="t bt" x="496" y="329">Régression à l’échelle du pays</text>
  <text class="t bl" x="496" y="348">cible : yield_t_ha · évaluée pour 10 cultures</text>

  <line x1="676" y1="362" x2="676" y2="382" stroke="#5aa47c" stroke-width="2" marker-end="url(#fleche)"/>

  <rect x="476" y="388" width="400" height="72" rx="10" fill="#e9f3ed" stroke="#5aa47c"/>
  <text class="t eyebrow" x="496" y="410">RÉPONSE</text>
  <text class="t bt" x="496" y="430">Un classement des cultures candidates</text>
  <text class="t bl" x="496" y="448">rendement prédit décroissant, pour le pays saisi</text>

  <!-- ─────────── séparation ─────────── -->
  <line x1="450" y1="86" x2="450" y2="460" stroke="#e4dccb" stroke-width="2" stroke-dasharray="5 6"/>

  <rect x="24" y="488" width="852" height="54" rx="10" fill="#fff7e6" stroke="#ffe2a8"/>
  <text class="t footb" x="48" y="512">Aucune fusion ligne à ligne.</text>
  <text class="t foot" x="230" y="512">Les deux jeux n’ont ni la même unité d’observation, ni les mêmes plages de valeurs,</text>
  <text class="t foot" x="48" y="530">ni la même définition de la pluie. Ils répondent à deux questions différentes, avec deux modèles distincts.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 520" width="768" height="520" role="img" aria-label="Deux jeux de données, deux services. /predict : l'utilisateur décrit sa parcelle et le modèle prédit un rendement. /recommend : le pays sert à préremplir température, pluie et pesticides, modifiables ; le modèle prédit les 10 cultures, qui sont classées.">
  <!-- Schéma écrit directement en SVG, sans données : les chiffres sont ceux du rapport. -->
  <title>Deux jeux de données, deux services</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5aa47c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ep     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #14452f; }
      .gran   { font-size: 11.5px; font-weight: 800; letter-spacing: 1.3px; fill: #2c7a53; }
      .pill   { font-size: 13.5px; font-weight: 700; fill: #14452f; }
      .util   { font-size: 13.5px; font-weight: 700; fill: #1e2a24; }
      .plein  { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .chip   { font-size: 12.5px; font-weight: 700; fill: #14452f; }
      .mdf    { font-size: 11.5px; font-weight: 700; fill: #2c7a53; }
      .note   { font-size: 11.5px; font-style: italic; fill: #63706a; }
      .src    { font-size: 12px; fill: #63706a; }
      .srcb   { font-size: 12px; font-weight: 600; fill: #3a4a43; }
      .fl     { stroke: #5aa47c; stroke-width: 2; marker-end: url(#fleche); }
    </style>
  </defs>

  <rect width="768" height="520" fill="#f7f4ec"/>

  <!-- ─────────── /predict : contexte parcellaire ─────────── -->
  <rect x="20" y="20" width="354" height="480" rx="14" fill="#ffffff" stroke="#e4dccb"/>
  <text class="ep" x="197" y="62" text-anchor="middle">/predict</text>
  <text class="gran" x="197" y="86" text-anchor="middle">CONTEXTE PARCELLAIRE</text>

  <rect x="139" y="166" width="116" height="30" rx="15" fill="#ffffff" stroke="#d9cfbd" stroke-width="1.5"/>
  <text class="util" x="197" y="186" text-anchor="middle">Utilisateur</text>
  <line class="fl" x1="197" y1="199" x2="197" y2="218"/>

  <rect x="39" y="220" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="89" y="237.5" text-anchor="middle">Culture</text>
  <rect x="147" y="220" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="197" y="237.5" text-anchor="middle">Sol</text>
  <rect x="255" y="220" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="305" y="237.5" text-anchor="middle">Pluie</text>
  <rect x="39" y="254" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="89" y="271.5" text-anchor="middle">Température</text>
  <rect x="147" y="254" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="197" y="271.5" text-anchor="middle">Engrais</text>
  <rect x="255" y="254" width="100" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="305" y="271.5" text-anchor="middle">Irrigation</text>
  <line class="fl" x1="197" y1="283" x2="197" y2="302"/>

  <rect x="119" y="304" width="156" height="30" rx="15" fill="#fdfcf7" stroke="#14452f" stroke-width="1.5"/>
  <text class="pill" x="197" y="324" text-anchor="middle">Modèle /predict</text>
  <line class="fl" x1="197" y1="337" x2="197" y2="356"/>

  <rect x="115" y="358" width="164" height="30" rx="15" fill="#14452f"/>
  <text class="plein" x="197" y="378" text-anchor="middle">Rendement prédit</text>

  <text class="srcb" x="197" y="468" text-anchor="middle">Agriculture CropYield</text>
  <text class="src" x="197" y="486" text-anchor="middle">999 769 lignes · 9 variables candidates</text>

  <!-- ─────────── /recommend : contexte historique adaptable ─────────── -->
  <rect x="394" y="20" width="354" height="480" rx="14" fill="#ffffff" stroke="#e4dccb"/>
  <text class="ep" x="571" y="62" text-anchor="middle">/recommend</text>
  <text class="gran" x="571" y="86" text-anchor="middle">CONTEXTE HISTORIQUE ADAPTABLE</text>

  <rect x="513" y="116" width="116" height="30" rx="15" fill="#ffffff" stroke="#d9cfbd" stroke-width="1.5"/>
  <text class="util" x="571" y="136" text-anchor="middle">Utilisateur</text>
  <line class="fl" x1="571" y1="149" x2="571" y2="168"/>

  <rect x="535" y="170" width="72" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="571" y="187.5" text-anchor="middle">Pays</text>
  <line class="fl" x1="571" y1="199" x2="571" y2="218"/>

  <rect x="476" y="220" width="190" height="30" rx="15" fill="#fdfcf7" stroke="#14452f" stroke-width="1.5"/>
  <text class="pill" x="571" y="240" text-anchor="middle">Données pays connues</text>
  <line class="fl" x1="571" y1="253" x2="571" y2="272"/>
  <text class="note" x="583" y="266">préremplissage</text>

  <rect x="430" y="274" width="106" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="483" y="291.5" text-anchor="middle">Température</text>
  <rect x="544" y="274" width="64" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="576" y="291.5" text-anchor="middle">Pluie</text>
  <rect x="616" y="274" width="96" height="26" rx="13" fill="#e8f2ea"/>
  <text class="chip" x="664" y="291.5" text-anchor="middle">Pesticides</text>

  <rect x="494" y="308" width="154" height="22" rx="11" fill="#ffffff" stroke="#5aa47c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="mdf" x="571" y="323" text-anchor="middle">↕ valeurs modifiables</text>
  <line class="fl" x1="571" y1="333" x2="571" y2="352"/>

  <rect x="476" y="354" width="190" height="30" rx="15" fill="#fdfcf7" stroke="#14452f" stroke-width="1.5"/>
  <text class="pill" x="571" y="374" text-anchor="middle">Modèle × 10 cultures</text>
  <line class="fl" x1="571" y1="387" x2="571" y2="406"/>

  <rect x="509" y="408" width="124" height="30" rx="15" fill="#14452f"/>
  <text class="plein" x="571" y="428" text-anchor="middle">Classement</text>

  <text class="srcb" x="571" y="468" text-anchor="middle">Dataset historique nettoyé → dataset /recommend</text>
  <text class="src" x="571" y="486" text-anchor="middle">15 664 lignes · 117 pays</text>
</svg>
